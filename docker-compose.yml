services:
  users-db:
    image: postgres:16-alpine
    container_name: kiora_users_db
    restart: unless-stopped
    ports:
    - 5432:5432
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no esta definido}
      POSTGRES_DB: kiora_users
      REDIS_PASSWORD: ${REDIS_PASSWORD:-rootpassword}
    networks:
    - kiora-backend-net
    volumes:
    - users_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USER:-postgres} -d kiora_users
      interval: 10s
      timeout: 5s
      retries: 5
  products-db:
    image: postgres:16-alpine
    container_name: kiora_products_db
