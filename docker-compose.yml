      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: kiora_redis
    restart: unless-stopped
    ports:
    - 6379:6379
    command: 'sh -c ''redis-server --requirepass "$$REDIS_PASSWORD"''

      '
    environment:
    - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD no esta definido}
    networks:
    - kiora-backend-net
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a $$REDIS_PASSWORD ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
      additional_contexts:
      - shared=./services/shared
    container_name: kiora_api_gateway
    restart: unless-stopped
    ports:
    - 3000:3000
    networks:
    - kiora-backend-net
    env_file:
    - ./services/api-gateway/.env.docker
    environment:
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-rootpassword}
      USERS_SERVICE_URL: http://users-service:3001
      PRODUCTS_SERVICE_URL: http://products-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      ORDERS_SERVICE_URL: http://orders-service:3004
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3005
      REPORTS_SERVICE_URL: http://reports-service:3006
      ACTIVITY_SERVICE_URL: http://activity-service:3007
      AI_SERVICE_URL: http://ai-service:3008
      STORES_SERVICE_URL: http://stores-service:3009
    depends_on:
      redis:
        condition: service_healthy
      users-service:
        condition: service_healthy
      products-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
      reports-service:
        condition: service_healthy
      activity-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      stores-service:
        condition: service_healthy
  users-service:
    build:
      context: ./services/users-service
      dockerfile: Dockerfile
      additional_contexts:
      - shared=./services/shared
    container_name: kiora_users_service
    restart: unless-stopped
    networks:
    - kiora-backend-net
    env_file:
    - ./services/users-service/.env.docker
    environment:
      DB_HOST: users-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no esta definido}
      DB_NAME: kiora_users
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD no
        esta definido}@users-db:5432/kiora_users
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-rootpassword}
      REDIS_PORT: 6379
      OTEL_SERVICE_NAME: users-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      TZ: ${TZ:-America/Bogota}
    depends_on:
      users-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3001/health
      interval: 15s
      timeout: 5s
      retries: 5
  products-service:
    build:
